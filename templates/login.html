{% extends 'base.html' %}

{% block title %}Вход в аккаунт{% endblock %}

{% block content %}
<h2>Вход в аккаунт</h2>

<form method="post">
    {{ form.hidden_tag() }}

    <div class="field">
        {{ form.email.label }}
        {{ form.email() }}
    </div>

    <div class="field">
        {{ form.password.label }}
        {{ form.password() }}
    </div>

    <div class="field">
        {{ form.submit() }}
    </div>

    <a href="/register">Зарегестрироваться</a>

</form>
{% endblock %}
